{% block rail_foot %}
      <a href="/">{{ t('web.admin.shell.back_to_site') }}</a>
      <a href="/watchlist">{{ t('web.nav.watchlist') }}</a>
      <a href="/research">{{ t('web.nav.research') }}{% if research_unread_count %}<span class="foot-count" aria-label="{{ t('web.research.unread_count', count=research_unread_count) }}">{{ research_unread_count }}</span>{% endif %}</a>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{ global_csrf_token }}">
